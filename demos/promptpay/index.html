<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080B12" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <title>PromptPay QR Maker — BANK.DEV</title>
    <script>
      // Same saved theme and language as the portfolio, applied before first paint.
      try {
        var t = localStorage.getItem('bankdev:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var l = localStorage.getItem('bankdev:lang');
        if (l === 'th' || l === 'en') document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/demos/promptpay/main.jsx"></script>
  </body>
</html>
