<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Patcharapon Khongmod (Bank) — Software Engineer and Full Stack Developer. Factory software systems, automation, and websites for clients." />
    <meta name="theme-color" content="#080B12" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>BANK.DEV — Patcharapon Khongmod</title>
    <script>
      // Apply saved theme + language before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('bankdev:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var l = localStorage.getItem('bankdev:lang');
        if (l === 'th' || l === 'en') document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
